<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Css/index.css">
    <title>Javascript程式設計範例</title>
</head>
<body>
    <h1>103下學期五專三年級Javascript程式設計課程</h1>
    <div style="
            display: flex;
            justify-content: center;  /* 水平置中 */
            gap: 10px;                /* 連結間距 */
            flex-wrap: wrap;          /* 換行排列（如有需要） */
        ">
            <a href="index.html">返回首頁</a>
            <a href="#" onclick="loadPage('about.html')">關於我</a>
            <a href="#" onclick="loadPage('research.html')">心理狀態</a>
            <a href="#" onclick="loadPage('homework.html')">N*N乘法表</a>
            <a href="#" onclick="loadPage('https://github-5b1g0039.github.io/waterPuzzle.html/')">水立方試管遊戲作業</a>
            <a href="#" onclick="loadPage('https://github-5b1g0039.github.io/react-app/')">React作業</a>
        </div>
        <div id="mainFrame" class="mainFrame">
            <!-- 這裡可以放首頁介紹文字 -->
     
        </div>

        <script>
            function loadPage(url) {
                const frame = document.getElementById('mainFrame');
                frame.innerHTML = `<iframe src="${url}" style="width:100%;height:100%;border:none;"></iframe>`;
            }
        </script>
</body>
</html>
